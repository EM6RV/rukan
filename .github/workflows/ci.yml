name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  APP_URL: http://localhost:3100
  ROOT_DOMAIN: localhost:3100
  DATABASE_URL: file:./data/ci.db
  ADMIN_PHONE: "0910000000"
  ADMIN_PASSWORD: ci-admin-password-123

jobs:
  checks:
    name: فحوص الكود (lint، types، اختبارات، بناء)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  e2e:
    name: اختبارات المتصفح (وصول وكيبورد)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: mkdir -p data && pnpm db:setup && pnpm db:seed:demo
      - name: مفاتيح VAPID للاختبار فقط
        run: pnpm push:keys | grep '^VAPID_' | sed 's/ *#.*//' >> "$GITHUB_ENV"
      - run: pnpm build
      - name: تشغيل الخادم
        run: |
          nohup pnpm exec next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3100/api/health && break || sleep 1; done
      - run: pnpm e2e
      - name: لوج الخادم عند الفشل
        if: failure()
        run: tail -n 80 server.log
